name: Contribution calendar

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/isocalendar.py"
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Isometric contribution calendar
        run: python scripts/isocalendar.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics.isocalendar.svg
          git diff --staged --quiet || git commit -m "chore: refresh contribution calendar"
          git push
